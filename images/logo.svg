<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Monogram Logo Icon (H + C Interlocked Circle) -->
  <g transform="translate(10, 8)">
    <circle cx="27" cy="27" r="25" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" />
    <circle cx="27" cy="27" r="21" fill="none" stroke="#111111" stroke-width="0.8" opacity="0.4" />
    <!-- Monogram H & C -->
    <text x="27" y="34" font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', serif" font-size="22" font-weight="700" text-anchor="middle" fill="#111111" letter-spacing="1">HC</text>
  </g>

  <!-- Brand Typography -->
  <text x="74" y="34" font-family="'Cormorant Garamond', 'Cinzel', 'Didot', Georgia, serif" font-size="26" font-weight="700" letter-spacing="4.5" fill="#111111">HAYAT'S</text>
  <text x="75" y="52" font-family="'Inter', 'Montserrat', sans-serif" font-size="11" font-weight="500" letter-spacing="7" fill="url(#goldAccent)">COLLECTION</text>
</svg>
